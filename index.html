<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piano · Ville-parc</title>
<style>
:root{
  --fh:"Didot","Bodoni 72","Bodoni MT","Libre Bodoni","Iowan Old Style",Georgia,serif;
  --fb:"Avenir Next","Gill Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --bg:#EEF1EA; --surface:#FCFCF8; --surface2:#E4E9DF; --text:#1D2A23; --muted:#5D6A61; --line:#C9D2C3;
  --yellow:#DDB06A; --yellow2:#EBD7AE; --pink:#B85A68; --blue:#3C7489; --blue2:#A9C8CF;
  --green:#2F5D46; --moss:#2F5D46; --aurora:#9C88C8;
  --ink:#1D2A23; --glow:rgba(184,90,104,.35); --wkey:#FDFDF9; --bkey:#1D2A23; --kstroke:#2A3A31;
  --sky1:#D7E7EA; --sky2:#F4EEDF; --sun:#EBC77F; --lakec:#7FA9B0; --lampop:0; --roof:#4B5761; --stone:#C99E68;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0E1813; --surface:#16231C; --surface2:#203127; --text:#EEF0E8; --muted:#97A59B; --line:#2C3E33;
    --green:#3E7A5C; --moss:#9CC7A6; --glow:rgba(184,90,104,.6); --wkey:#F1F1EA; --bkey:#08100C; --kstroke:#000;
    --sky1:#0B1420; --sky2:#1E2D3A; --sun:#E8ECEF; --lakec:#1E3A44; --lampop:1; --roof:#2B333A; --stone:#7E6545; color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.pix{font-family:"Courier New",Courier,monospace;font-weight:900;letter-spacing:.32em;text-transform:uppercase;font-size:13px}
h1,h2,h3{font-family:var(--fh);font-weight:900;margin:0;line-height:1.05}
h2{font-size:24px;margin:34px 0 6px}
h3{font-size:17px}
p{margin:.4em 0}
.wrap{max-width:780px;margin:0 auto;padding:0 14px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-top:8px;padding-bottom:8px}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 11px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--text);color:var(--bg)}
.sndb{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;flex-shrink:0}
.sndb.s-ok{color:#2a9d5c}
.nota{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}
.nota button{border:0;background:transparent;padding:6px 8px;font-size:12px;font-weight:700;color:var(--muted)}
.nota button.on{background:var(--surface2);color:var(--text)}

/* hero */
.hero{padding:30px 0 10px;text-align:center}
.hero .pix{color:var(--muted);margin-bottom:14px}
.hero h1{font-size:clamp(34px,10vw,64px);letter-spacing:-.01em}
.hero h1 .p{color:var(--pink)}
.lead{color:var(--muted);max-width:520px;margin:10px auto 0}
.wave{display:block;margin:6px auto 0;width:100%;max-width:520px;height:46px}
.wave path{fill:none;stroke:var(--yellow);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(246,217,76,.6))}

.card{background:var(--surface);border-radius:18px;padding:16px;margin:12px 0}
.card.flat{background:transparent;padding:4px 0}
.small{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.center{text-align:center}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chips.sm .chip{padding:4px 10px;font-size:13px}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:var(--pink);color:#fff;font-size:15px}
.btn.alt{background:var(--surface2);color:var(--text)}
.btn.playing{background:var(--blue)}

/* degree cards */
.degs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.deg{border:0;border-radius:12px;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;transition:transform .15s}
.deg b{font-family:var(--fh);font-size:clamp(20px,6vw,34px);line-height:1}
.deg span{font-family:var(--fh);font-size:clamp(9px,2.6vw,14px);margin-top:4px;line-height:1.1;text-align:center;word-break:break-all}
.deg i{font-style:normal;font-size:10px;opacity:.75;font-weight:700}
.deg.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--bg),0 0 0 5px currentColor,0 0 24px var(--glow)}
.c-y{background:var(--yellow);color:var(--ink)} .c-y2{background:var(--yellow2);color:var(--ink)}
.c-p{background:var(--pink);color:#fff} .c-b{background:var(--blue);color:#fff} .c-b2{background:var(--blue2);color:#141a33}

/* function groups */
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.grp{border:2.5px solid;border-radius:16px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.grp .mini{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.grp .deg{width:44px;aspect-ratio:auto;height:54px}
.grp .deg b{font-size:20px} .grp .deg span{font-size:10px}
.grp .pix{font-size:10px;letter-spacing:.2em;margin-top:4px}
.g-y{border-color:var(--yellow)} .g-y .pix{color:#c9a800} .g-p{border-color:var(--pink)} .g-p .pix{color:var(--pink)} .g-b{border-color:var(--blue)} .g-b .pix{color:var(--blue)}
@media (prefers-color-scheme: dark){ .g-y .pix{color:var(--yellow)} .g-b .pix{color:var(--blue2)} }

/* keyboard */
.kbwrap{overflow-x:auto;margin-top:10px;border-radius:10px}
.kbwrap svg{display:block;width:100%}
.kbwrap rect{cursor:pointer}
.kbwrap circle,.kbwrap text{pointer-events:none}
.notes{font-weight:700;margin-top:6px}

/* circle */
.circle{display:block;margin:0 auto;width:100%;max-width:340px}
.circle path{cursor:pointer;stroke:var(--bg);stroke-width:2}
.circle text{font-weight:800;pointer-events:none}

.tip{border-left:4px solid var(--yellow);padding:4px 0 4px 12px;margin:12px 0}
.tip.p{border-color:var(--pink)} .tip.b{border-color:var(--blue)}
.tip b{display:block}
ul.clean{padding-left:18px;margin:6px 0} ul.clean li{margin:4px 0}

.ladder{display:flex;flex-direction:column;gap:0}
.lrow{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:8px 6px;border-radius:12px;width:100%}
.lrow.on{background:var(--surface2)}
.lrow .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.lrow .nm{font-weight:800;width:96px;flex-shrink:0}
.lrow .fm{font-family:"Courier New",monospace;font-size:13px;color:var(--muted)}
.lchg{font-size:12px;color:var(--muted);padding-left:30px}

.ex .tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--surface2);margin-bottom:6px}
.ex h3{margin-bottom:4px}
.ex .goal{font-size:14px}
.rinfo{margin-top:12px;font-size:14px}
.srch{display:flex;gap:8px}
.gprog{margin-top:10px;font-size:15px}
.progress{height:8px;background:var(--surface2);border-radius:99px;margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--pink);border-radius:99px}
.dna{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dna div{background:var(--surface);border-radius:14px;padding:12px;font-size:14px;border-top:4px solid var(--yellow)}
.dna div:nth-child(2){border-color:var(--pink)} .dna div:nth-child(3){border-color:var(--blue)} .dna div:nth-child(4){border-color:var(--blue2)}
.dna b{display:block;margin-bottom:4px}
@media (max-width:420px){.dna{grid-template-columns:1fr}}
.task{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.task:last-child{border:0}
.task span{flex-shrink:0;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.task.on span{background:var(--pink);border-color:var(--pink)}
.task.on{color:var(--muted);text-decoration:line-through}
.kxs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kx{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.kx b{font-size:14px} .kx span{font-size:13px;color:var(--muted)} .kx small{font-size:12px}
.kx.on{border-color:var(--pink)}
@media (max-width:380px){.kxs{grid-template-columns:1fr}}
.tbadge{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px 3px 3px;margin:2px 4px 2px 0;font-size:13px;font-weight:700}
.tbadge i{font-style:normal;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:12px;color:var(--ink)}
.tokrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tkb{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:10px;padding:5px 7px;font-size:12px;font-weight:800}
.tkb i{font-style:normal;color:var(--muted);font-size:13px}
.tkl{color:var(--blue)} .tkr{color:var(--pink)} .tks{color:var(--muted)}
@media (prefers-color-scheme: dark){.tkl{color:var(--blue2)}}
.tokc.l{border-color:var(--blue)} .tokc.r{border-color:var(--pink)}
.stars{color:var(--pink);letter-spacing:2px;font-size:12px}
.aplist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.apc{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px}
.apc span{font-size:12px;color:var(--muted)} .apc small{font-size:11px}
.apc.on{border-color:var(--pink)}
@media (max-width:380px){.aplist{grid-template-columns:1fr}}
.step{display:flex;gap:12px;margin-top:26px}
.stepn{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fh);margin-top:2px}
.stepb{flex:1;min-width:0}
.stepb h2{margin:4px 0 8px;font-size:21px}
.gloss{display:flex;flex-direction:column;gap:0}
.gloss div{padding:8px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.gloss div:last-child{border:0}
.gloss span{font-size:14px;color:var(--muted)}
.rep{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.repi{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.repi.on{border-color:var(--text)}
.repn{flex:1;border:0;background:transparent;text-align:left;padding:9px 12px;font-weight:800;display:flex;flex-direction:column}
.repn small{font-weight:500;color:var(--muted);font-size:12px}
.repd{border:0;background:var(--surface2);padding:0 14px;font-size:15px}
.repd.ask{background:var(--pink);color:#fff;font-weight:800;font-size:13px}
.arpsel{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.arpsel select{font:inherit;font-size:15px;font-weight:700;color:var(--text);background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:220px}
.arpd{margin:6px 0 0}
.tier{padding:6px}
.trow{display:flex;gap:6px;align-items:stretch;padding:4px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border:0}
.tlab{width:42px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:22px;color:var(--ink)}
.titems{display:flex;flex-wrap:wrap;gap:6px;flex:1;align-content:center;padding:4px 0}
.tk{border:0;border-radius:10px;padding:9px 12px;background:var(--surface2);font-family:var(--fh);font-size:15px;min-width:52px}
.tk.min{font-style:italic;font-family:"Avenir Next",system-ui,sans-serif;font-weight:800}
.tp{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;width:100%}
.tp b{font-size:14px} .tp span{font-size:13px;color:var(--muted)} .tp small{font-size:12px}
.tp.on{border-color:var(--pink);background:var(--surface2)}
.timeline{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.timeline::-webkit-scrollbar{display:none}
.tl{flex-shrink:0;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;min-width:120px}
.tl span{font-size:12px;color:var(--muted)} .tl.on{background:var(--text);color:var(--bg);border-color:var(--text)} .tl.on span{color:var(--bg);opacity:.7}
.quiz .qhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700}
.qtext{font-size:18px;margin:12px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:14px 8px;font-weight:800;font-size:15px}
.opt.good{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.opt.bad{background:var(--pink);color:#fff;border-color:var(--pink)}
.opt[disabled]:not(.good):not(.bad){opacity:.5}
.fb{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:14px;background:var(--surface2)}
.fb.ok{border-left:4px solid var(--yellow)} .fb.ko{border-left:4px solid var(--pink)}
.dtab tr{cursor:pointer} .dtab td{padding:8px 4px}
.dnum{display:inline-flex;width:34px;height:34px;border-radius:9px;align-items:center;justify-content:center;font-family:var(--fh);font-size:17px}
.cands{display:flex;flex-direction:column;gap:6px}
.cand{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:10px 12px}
.cand b{grid-column:1} .cand span{grid-column:1;font-size:13px;color:var(--muted)} .cand small{grid-column:1/3;font-size:12px;color:var(--muted)}
.cand .ty{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--surface2)}
.ty-original{background:var(--yellow)!important;color:var(--ink)} .ty-reprise{background:var(--pink)!important;color:#fff} .ty-live{background:var(--blue)!important;color:#fff}
.srch input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text)}
.srch input:focus{outline:3px solid var(--blue);outline-offset:1px}
.btn[disabled]{opacity:.6}
.player{position:sticky;top:52px;z-index:10;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar{border:1.5px solid var(--line);border-radius:10px;padding:10px 3px;min-height:48px;background:transparent;font-family:var(--fh);font-size:13px;line-height:1.2;word-break:break-word}
.bar.sel{border-color:var(--text)}
.bar.cur{background:var(--pink);border-color:var(--pink);color:#fff}
.rinfo p{margin:8px 0}
.rinfo .lbl{font-weight:800}
.notate{background:var(--surface2);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:13px}
.notate div{padding:3px 0;border-bottom:1px solid var(--line)}
.notate div:last-child{border:0}
.notate .cn{font-weight:800;display:inline-block;min-width:74px}
.notate .lhn{color:var(--blue)} .notate .rhn{color:var(--pink)}
@media (prefers-color-scheme: dark){ .notate .lhn{color:var(--blue2)} }
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}

.hands{display:flex;justify-content:center;gap:16px}
.hands svg{width:46%;max-width:180px}
.met{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.beats{display:flex;gap:8px}
.beats span{width:18px;height:18px;border-radius:50%;background:var(--surface2)}
.beats span.on{background:var(--pink)} .beats span.on.first{background:var(--yellow)}
input[type=range]{accent-color:var(--pink);width:160px}
.stat{font-family:var(--fh);font-size:22px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
@media (prefers-reduced-motion: reduce){ .deg{transition:none} }

function renderModes(){const{M,sc,parent,ch}=modeData(),X=MODEX[S.mode],maj=spell(sc[0].l+(sc[0].a>0?'#'.repeat(sc[0].a):'b'.repeat(-sc[0].a)),MAJ);

  const P=parse(MAJ_KEYS[S.gk].t),pm=spell(MAJ_KEYS[S.gk].t,MAJ),wk={};

   <p class="small">${S.mw===null?'Touche un départ pour l\'entendre.':`De ${nm(pm[S.mw])} à ${nm(pm[S.mw])} : <b>${nm(pm[S.mw])} ${MODES[S.mw].n.toLowerCase()}</b>. ${MODES[S.mw].mood}`}</p></div>

  <div class="ladder card">${BRIGHT.map((i,k)=>`<button class="lrow ${S.mode===i?'on':''}" data-mode="${i}"><span class="dot" style="background:${MODES[i].col}"></span><span class="nm">${MODES[i].n}</span><span class="fm">${MODES[i].f.join(' ')}</span></button>${k<6?`<div class="lchg">↓ ${CHG[k]}</div>`:''}`).join('')}</div>

  <h2>8 · Les astuces</h2>
  <div class="card"><div class="tip"><b>Majeur ou mineur + 1 note</b>Lydien = majeur avec ♯4. Mixolydien = majeur avec ♭7. Dorien = mineur avec 6te majeure. Phrygien = mineur avec ♭2. Locrien = phrygien avec ♭5.</div>
   <div class="tip p"><b>Trouver la gamme parente</b>Dorien : 1 ton en dessous. Phrygien : tierce majeure en dessous. Lydien : quarte en dessous. Mixolydien : quarte au-dessus. Éolien : tierce mineure au-dessus. Locrien : ½ ton au-dessus.</div>

function handSVG(side){const fg=[[6,72,22,48,-32,1],[34,22,18,62,0,2],[55,10,18,72,0,3],[76,18,18,64,0,4],[96,38,16,50,0,5]];

function vlBuild(degs,style,sevF){const K=spell(MAJ_KEYS[S.gk].t,MAJ),sev=sevF||['shell','rootless'].includes(style),chs=degs.map(d=>chordAt(K,d,sev,false));
  const iv=c=>c.pcs.map(p=>mod(p-c.pcs[0])),r=c=>c.pcs[0];let rh,lh,names=chs.map(c=>c.name);
  if(style==='root'){rh=chs.map(c=>{const b0=57+mod(r(c)-57);return stack(c.pcs,b0-c.pcs[0]);});lh=chs.map(c=>[bass(r(c),40)]);}
  else if(style==='lead'){rh=lead(chs.map(c=>c.pcs),55,77,65);lh=chs.map(c=>[bass(r(c),40)]);}
  else if(style==='pop'){rh=lead(chs.map(c=>{const I=iv(c);return I.length===3&&I[1]===4?[...c.pcs,mod(r(c)+2)]:c.pcs;}),57,79,67);lh=chs.map(c=>{const b=bass(r(c),36);return[b,b+12];});
    names=chs.map(c=>{const I=iv(c);return I.length===3&&I[1]===4?c.name+'add9':c.name;});}
  else if(style==='open'){rh=lead(chs.map(c=>{const I=iv(c);return[mod(r(c)+I[1]),c.pcs[3]!==undefined?c.pcs[3]:r(c),c.pcs[2]];}),60,81,70);lh=chs.map(c=>{const b=bass(r(c),36);return[b,b+iv(c)[2]];});}
  else if(style==='shell'){rh=lead(chs.map(c=>[c.pcs[1],c.pcs[3]]),55,72,62);lh=chs.map(c=>[bass(r(c),40)]);}
  else{rh=lead(chs.map(c=>{const I=iv(c),dom=I[1]===4&&I[3]===10,dim=I[2]===6;return[c.pcs[1],dom?mod(r(c)+9):c.pcs[2],c.pcs[3],dim?mod(r(c)+5):mod(r(c)+2)];}),56,79,66);lh=chs.map(c=>[bass(r(c),40)]);
    names=chs.map(c=>{const I=iv(c),q=c.q;return q==='maj7'?c.name.replace('maj7','maj9'):q==='m7'?c.name.replace('m7','m9'):q==='7'?c.name.replace(/7$/,'13'):c.name;});}
  return chs.map((c,i)=>({lh:lh[i],rh:rh[i],d:4,label:names[i]}));}

function vqVoicing(k){const p=gpc(),b=bass(p,40),c0=57+mod(p-57);

function tr(n,k){const a=parse(n),K=parse(k);const l=LET[(LET.indexOf(K.l)+LET.indexOf(a.l))%7];const pc=mod(K.pc+a.pc);let x=mod(pc-LPC[l]);if(x>6)x-=12;return{l,a:x,pc};}
const RK=()=>MAJ_KEYS[S.rKey].t;
function rOff(){const p=parse(RK()).pc;return p<=6?p:p-12;}
function cLabel(c){const k=RK();return nm(tr(c[0],k))+c[1]+(c[2]?'/'+nm(tr(c[2],k)):'');}
function cSpell(pc,c){if(pc===8)return(c[0]==='E'||c[2]==='G#')?'G#':'Ab';if(pc===6)return'F#';return{1:'Db',3:'Eb',10:'Bb'}[pc]||PCN[pc][0];}
function noteIn(m0,c){const o=rOff(),m=m0+o,n=tr(cSpell(mod(m0),c),RK());let oc=Math.floor(m/12)-1;if(n.l==='B'&&n.a>0)oc--;if(n.l==='C'&&n.a<0)oc++;return nm(n)+oc;}

function rChordSteps(R,c,pre=''){const o=rOff(),lh=c[3].map(x=>x+o),rh=c[4].map(x=>x+o),b=c[5]||4,label=pre+cLabel(c),show={lh,rh},out=[];
  if(R.rh==='pop'){const hits=b===4?[1.5,1.5,1]:b===8?[1.5,1.5,1,1.5,1.5,1]:[b];hits.forEach((d,i)=>out.push(i===0?{lh,rh,d,sus:b,label,show}:{rh,d,show}));}
  else if(R.rh==='arp'){const seq=[...lh,...rh,...rh.slice(1,-1).reverse()],L=lh.length,n=b*2;
    for(let i=0;i<n;i++){const m=i<seq.length?seq[i]:seq[L+((i-L)%(seq.length-L))],isL=i<L;
      const st={d:.5,sus:isL?b-i*.5:1,show};st[isL?'lh':'rh']=[m];if(i===0)st.label=label;out.push(st);}}
  else out.push({lh,rh,d:b,label,show});return out;}
function rSteps(R){if(R.ba)return[...R.before.flatMap(c=>rChordSteps(R,c,'Avant · ')),{d:1.5,show:{}},...R.after.flatMap(c=>rChordSteps(R,c,'Après · '))];
  return R.ch.flatMap(c=>rChordSteps(R,c));}

   return{html:`En <b>${k.name}</b>, quel accord est le <b>${ROMM[d]}</b> ?`,...mcq(names[d],names),
   exp:`Le ${ROMM[d]} de ${k.name} est <b>${names[d]}</b>. En majeur : I, IV, V majeurs ; ii, iii, vi mineurs ; vii° diminué. Toujours le même schéma dans les 12 tonalités.`};},
 fn(L){const k=kInfo('maj',kpick(L)),d=pick(L.deg.length<4?[0,1,2,3,4,5,6]:L.deg),c=chordAt(k.scale,d,false,false);
   return{html:`En <b>${k.name}</b>, à quelle famille appartient <b>${c.name}</b> ?`,opts:FUNCN,ans:FOF[d],
   exp:`${c.name} est le <b>${ROMM[d]}</b> → ${FUNCN[FOF[d]]}. Maison = I, vi, iii · Départ = IV, ii · Retour = V, vii°.`};},
 n2d(L){const k=kInfo('maj',kpick(L)),d=pick(L.deg.length<4?[0,2,3,4]:[0,1,2,3,4,5,6]),lab=[0,1,2,3,4,5,6].map(x=>`${x+1} · ${DEGN[x]}`);
   return{html:`En <b>${k.name}</b>, quel degré est la note <b>${nm(k.scale[d])}</b> ?`,...mcq(lab[d],lab),
   exp:`${nm(k.scale[d])} = degré <b>${d+1}, ${DEGN[d].toLowerCase()}</b> : ${SENS[d]}.`};},
 earN(L){const k=kInfo('maj',kpick(L)),pc=k.scale[0].pc,d=pick(L.earN),T=tonicMidi(pc),note=T+MAJ[d];
   const path=d===0?[0]:d<=3?[...Array(d+1).keys()].reverse():[...Array(8-d).keys()].map(x=>d+x);
   return{html:`On installe la tonalité (I – IV – V – I), puis une note. <b>Quel degré ?</b>`,opts:L.earN.map(x=>`${x+1} · ${DEGN[x]}`),ans:L.earN.indexOf(d),
   audio:[...cadence(pc),{d:1},{rh:[note],d:3}],alt:[['▶ La note seule',[{rh:[note],d:2}]],['▶ La tonique',[{rh:[T],d:2}]]],
   after:['▶ Entendre la résolution',path.map(x=>({rh:[T+(x===7?12:MAJ[x])],d:x===path[path.length-1]?2:.75}))],
   exp:`C'était le <b>${d+1}</b> (${nm(k.scale[d])} en ${k.name}) : ${SENS[d]}.`};},
 earC(L){const k=kInfo('maj',kpick(L)),pc=k.scale[0].pc,d=pick(L.earC),v=lead([trip(pc,0),trip(pc,d)],55,76,65)[1];
   return{html:`On installe la tonalité, puis un accord. <b>Quel degré ?</b>`,opts:L.earC.map(x=>ROMM[x]),ans:L.earC.indexOf(d),
   audio:[...cadence(pc),{d:1},{lh:[bass(trip(pc,d)[0])],rh:v,d:3}],alt:[['▶ L\'accord seul',[{lh:[bass(trip(pc,d)[0])],rh:v,d:2}]]],
   exp:`C'était <b>${ROMM[d]}</b> (${chordAt(k.scale,d,false,false).name}), famille ${FUNCN[FOF[d]]}. ${['Repos total.','Mineur, tension douce : il prépare souvent le V.','Mineur et ambigu, proche du I.','Majeur, on « part » de la maison.','Majeur et tendu : il appelle le I.','Mineur : la maison triste.'][d]}`};},
 earP(L){const k=kInfo('maj',kpick(L)),list=TPROGS.slice(0,L.prog),p=pick(list),lab=x=>x.map(d=>ROMM[d]).join(' – ');
   return{html:'Écoute la progression. <b>Laquelle est-ce ?</b>',...mcq(lab(p),list.map(lab)),audio:progAud(k.scale[0].pc,p,false,2),
   exp:`<b>${lab(p)}</b> en ${k.name} : ${p.map(d=>chordAt(k.scale,d,false,false).name).join(' – ')}. Écoute la basse : c'est souvent elle qui trahit la progression.`};}};

function answer(ok){const T=S.tr,st=T.stats[T.mode]||(T.stats[T.mode]={ok:0,tot:0,best:0});st.tot++;if(ok){st.ok++;T.streak++;st.best=Math.max(st.best,T.streak);}else T.streak=0;saveStats();
  pedDay();if(ok)S.ped.todayOk++;addXP(ok?(T.hint?5:10):1,ok?'':'merci d\'avoir essayé');
  if(T.sess&&T.view==='sess'&&!T.sess.done){T.sess.log.push({m:T.mode,ok});if(ok)T.sess.ok++;}}
function quizHTML(){const T=S.tr,q=T.q,st=T.stats[T.mode]||{ok:0,tot:0,best:0};if(!q)return'';const done=T.ans!==null;
  let body='';
  if(q.type==='kb'){const mk={};
    if(!done)T.sel.forEach(m=>mk[m]={c:'y',f:''});
    else{const tgt=new Set(q.target),selPc=new Set(T.sel.map(mod));T.sel.forEach(m=>mk[m]={c:tgt.has(mod(m))?'y':'rh',f:tgt.has(mod(m))?'✓':'✗'});
      q.target.forEach(pc=>{if(!selPc.has(pc)){const m=60+pc;mk[m]={c:'lh',f:'!'};}});}
    body=`<div class="kbwrap" id="trkb">${kb(mk,60,83)}</div>${done?`<div class="legend"><span><i style="background:var(--yellow)"></i>juste</span><span><i style="background:var(--pink)"></i>en trop</span><span><i style="background:var(--blue)"></i>oubliée</span></div>`:''}
    ${!done?`<div class="row"><button class="btn alt" data-act="trClear">Effacer</button><button class="btn" data-act="trCheck">Valider (${new Set(T.sel.map(mod)).size}/7)</button></div>`:''}`;}
  else body=`<div class="opts ${q.opts.length>4?'many':''}">${q.opts.map((o,i)=>`<button class="opt ${done?(i===q.ans?'good':i===T.ans?'bad':''):''}" data-opt="${i}" ${done?'disabled':''}>${o}</button>`).join('')}</div>`;
  const ok=done&&(q.type==='kb'?T.ans===1:T.ans===q.ans);
  return `<div class="card quiz"><div class="qhead"><span>✓ ${st.ok}/${st.tot}${st.tot?` · ${Math.round(st.ok/st.tot*100)} %`:''}</span><span>${T.streak?`série ${T.streak} 🔥`:''}${st.best?` · record ${st.best}`:''}</span></div>
   <p class="qtext">${q.html}</p>
   ${!done&&HINTS[T.mode]?(T.hint?`<div class="hint">💡 ${HINTS[T.mode]}</div>`:`<button class="chip" data-act="trHint">💡 Un indice</button>`):''}
   ${q.audio?`<div class="row" style="margin-top:0"><button class="btn alt" data-act="trReplay">▶ Réécouter</button>${(q.alt||[]).map((a,i)=>`<button class="btn alt" data-tralt="${i}">${a[0]}</button>`).join('')}</div>`:''}
   ${body}
   ${done?`<div class="fb ${ok?'ok':'ko'}"><b>${ok?PRAISE():OOPS()}</b> ${q.exp}</div>
     <div class="row">${q.after?`<button class="btn alt" data-act="trAfter">${q.after[0]}</button>`:''}<button class="btn" data-act="trNext">${T.sess&&!T.sess.done&&T.view==='sess'?(T.sess.i+1>=T.sess.n?'Voir mon résultat':'Question suivante'):'Question suivante'}</button></div>`:''}</div>`;}

function keysLesson(){return `<h2>Apprendre les 24 tonalités</h2>
 <div class="card"><table class="t">
  <tr><td><b>Semaine 1</b></td><td>Do, Sol, Fa et leurs relatives (La m, Mi m, Ré m). 0 ou 1 altération.</td></tr>
  <tr><td><b>Semaine 2</b></td><td>Ré, Si♭, La, Mi♭ (2 et 3 altérations) + relatives.</td></tr>
  <tr><td><b>Semaine 3</b></td><td>Mi, La♭, Si, Ré♭ (4 et 5 altérations) + relatives.</td></tr>
  <tr><td><b>Semaine 4</b></td><td>Fa♯ / Sol♭ (6) et révision de tout le cycle.</td></tr></table>
  <p class="small" style="margin-top:8px">Chaque jour, pour la tonalité du jour : l'armure à voix haute, la gamme mains séparées, les accords I – IV – V – I, une progression pop. 10 minutes suffisent.</p></div>
 <div class="card">
  <div class="tip"><b>Les deux phrases à connaître par cœur</b>Dièses : Fa Do Sol Ré La Mi Si. Bémols : Si Mi La Ré Sol Do Fa. C'est la même phrase à l'envers, et chaque note est à une quinte de la suivante.</div>
  <div class="tip p"><b>Trouver la tonalité d'une partition</b>1) Lis l'armure : 2 possibilités, majeure ou relative mineure. 2) Regarde le dernier accord (souvent le I) et la dernière note de basse. 3) Cherche la sensible : un Sol♯ accidentel sans armure ? Tu es en La mineur.</div>
  <div class="tip b"><b>Trouver la tonalité à l'oreille</b>Fredonne la note sur laquelle la chanson « se repose » à la fin d'une phrase. Trouve-la au piano : c'est ta tonique. Puis joue sa tierce majeure et sa tierce mineure : celle qui colle te dit majeur ou mineur.</div>
  <div class="tip"><b>Les enharmonies</b>Fa♯ majeur (6♯) = Sol♭ majeur (6♭). Ré♭ (5♭) = Do♯ (7♯). Si (5♯) = Do♭ (7♭). Même son, nom différent : on choisit la version avec le moins d'altérations.</div>
  <div class="tip p"><b>Les tonalités voisines</b>Depuis n'importe quelle tonalité, les modulations les plus naturelles vont vers : la relative, la tonalité de la dominante (+1♯), celle de la sous-dominante (+1♭). Elles partagent 6 notes sur 7.</div>
  <div class="tip b"><b>Penser en degrés pour transposer</b>Si tu sais qu'une chanson fait I – V – vi – IV, tu peux la jouer dans les 12 tonalités sans rien réapprendre. C'est l'objet de l'entraînement « Degrés ».</div></div>`;}
function degLesson(){const K=spell('C',MAJ),ch=[0,1,2,3,4,5,6].map(d=>chordAt(K,d,false,false));
 const cad=(title,desc,degs,tag)=>exCard({tag,title,desc,bpm:80,steps:progAud(0,degs,false,2).map((s,i)=>({...s,label:ROMM[degs[i]]+' · '+ch[degs[i]].name}))});
 return `<h2>Tout sur les degrés</h2>
 <p class="small">Un degré, c'est la position d'une note (ou d'un accord) dans la gamme : 1 = tonique, 2 = la note suivante, etc. Les degrés sont la langue commune à toutes les tonalités. Touche une ligne pour l'entendre en Do.</p>
 <div class="card"><table class="t dtab">${[0,1,2,3,4,5,6].map(d=>`<tr data-dplay="${d}"><td><span class="dnum ${GRP[d]}">${d+1}</span></td><td><b>${DEGN[d]}</b><br><span class="small">${nm(K[d])} · accord ${ROMM[d]} = ${ch[d].name} · ${FUNCN[FOF[d]].split(' ')[0]}</span><br><span style="font-size:13px">${SENS[d][0].toUpperCase()+SENS[d].slice(1)}.</span></td></tr>`).join('')}</table></div>
 <h3 style="margin-top:20px">Les notes qui tirent</h3>
 <div class="card">
  <div class="tip"><b>7 → 1 : la sensible</b>À un demi-ton de la tonique, elle veut monter. C'est elle qui rend le V si tendu (Si dans Sol7 en Do). En mineur, on la crée exprès (Sol♯ en La mineur).</div>
  <div class="tip p"><b>4 → 3</b>La sous-dominante est à ½ ton au-dessus de la tierce et veut y descendre. Dans Sol7 → Do : Fa descend sur Mi, Si monte sur Do. Ce double mouvement EST la cadence parfaite.</div>
  <div class="tip b"><b>Les notes stables : 1, 3, 5</b>Ce sont les notes de l'accord de tonique. Une mélodie qui finit sur l'une d'elles sonne conclue ; sur 2, 4, 6 ou 7, elle reste en suspens.</div></div>
 <h3 style="margin-top:20px">Ce qui suit quoi</h3>
 <div class="card"><table class="t">
  <tr><td><b>I</b></td><td>peut aller partout. C'est le point de départ et d'arrivée.</td></tr>
  <tr><td><b>ii</b></td><td>→ V (ou vii°). Le duo ii – V est le cœur du jazz.</td></tr>
  <tr><td><b>iii</b></td><td>→ vi (cycle des quintes) ou → IV.</td></tr>
  <tr><td><b>IV</b></td><td>→ V, → I (cadence plagale), → ii, ou → iv mineur (emprunt).</td></tr>
  <tr><td><b>V</b></td><td>→ I. Surprise : → vi (cadence rompue).</td></tr>
  <tr><td><b>vi</b></td><td>→ ii ou → IV, rarement directement → V.</td></tr>
  <tr><td><b>vii°</b></td><td>→ I, comme un V sans sa fondamentale.</td></tr></table>
  <p class="small" style="margin-top:8px">Règle générale : les fondamentales qui descendent de quinte (ou montent de quarte) sonnent le plus naturel. D'où le cycle iii → vi → ii → V → I.</p></div>
 <h3 style="margin-top:20px">Les 4 cadences (fins de phrase)</h3>
 ${cad('Cadence parfaite','V → I : la fin définitive, le point final.',[1,4,0],'Point final')}
 ${cad('Cadence plagale','IV → I : le « amen » des hymnes. Fin douce, sans tension.',[0,3,0],'Fin douce')}
 ${cad('Demi-cadence','Phrase qui s\'arrête sur le V : une virgule, on attend la suite.',[0,5,1,4],'Virgule')}
 ${cad('Cadence rompue','V → vi : on attend le I, on obtient la maison triste. Effet de surprise.',[0,3,4,5],'Surprise')}
 ${cad('Le cycle des quintes','iii → vi → ii → V → I : chaque accord prépare le suivant. Base de milliers de standards.',[2,5,1,4,0],'Le grand classique')}
 <h3 style="margin-top:20px">En mineur</h3>
 <div class="card"><p>i, ii°, III, iv, v, VI, VII en mineur naturel. On remplace presque toujours le v par un <b>V majeur</b> (mineur harmonique) pour retrouver la sensible et la vraie cadence. Le III et le VII majeurs donnent la couleur « épique » des musiques mineures.</p>
  <p class="small">Exemple en La mineur : Lam, Si°, Do, Rém, <b>Mi</b> (au lieu de Mim), Fa, Sol.</p></div>
 <h3 style="margin-top:20px">Chiffrages</h3>
 <div class="card"><div class="tip"><b>Chiffres romains</b>Majuscule = majeur (IV), minuscule = mineur (vi), ° = diminué (vii°), ø = demi-diminué. On ajoute 7, maj7 pour les accords à 7e.</div>
  <div class="tip p"><b>Système Nashville</b>Les musiciens de studio écrivent 1 – 5 – 6m – 4 au lieu des noms d'accords. Une grille, toutes les tonalités : le chanteur choisit, tout le monde transpose de tête.</div>
  <div class="tip b"><b>Les accords hors tonalité</b>Un accord majeur sur un degré normalement mineur est souvent une dominante secondaire (III7 → vi, II7 → V). Un accord mineur à la place d'un majeur est souvent un emprunt (iv au lieu de IV).</div></div>
 <h3 style="margin-top:20px">Méthode pour l'oreille</h3>
 <div class="card"><ul class="clean">
  <li><b>Toujours la tonalité d'abord.</b> Un degré n'existe que par rapport à une tonique : écoute la cadence avant de répondre.</li>
  <li><b>Chante la résolution.</b> Après une note, chante le chemin jusqu'au 1 : si tu descends 3 notes, c'était le 4.</li>
  <li><b>Associe des sensations,</b> pas des intervalles : le 7 « tire », le 6 est « tendre », le 5 est « ouvert ».</li>
  <li><b>Peu mais souvent.</b> 5 minutes par jour battent 1 heure le dimanche. Monte de niveau quand tu dépasses 85 % sur 20 questions.</li></ul></div>`;}

S.tr.view=S.tr.view||'sess';S.tr.sess=null;S.tr.hint=false;
const ALLM=[...TRM.keys.map(m=>['keys',m[0],m[1]]),...TRM.deg.map(m=>['deg',m[0],m[1]])];
const HINTS={armure:'Dièses : la tonique est ½ ton au-dessus du dernier dièse. Bémols : c\'est l\'avant-dernier bémol.',compte:'Ordre des dièses : Fa Do Sol Ré La Mi Si. Une mineure a la même armure que sa relative majeure.',
 relative:'La relative mineure est 3 demi-tons sous la tonique majeure (Do → La).',gamme:'Recette majeure : ton, ton, ½, ton, ton, ton, ½.',mm:'Écoute le premier et le dernier accord : lumineux = majeur, sombre = mineur.',
 c2d:'Compte les noms de notes depuis la tonique : tonique = I.',d2c:'Majeur : I, IV, V majeurs ; ii, iii, vi mineurs ; vii° diminué.',fn:'Maison = I, vi, iii · Départ = IV, ii · Retour = V, vii°.',
 n2d:'Compte depuis la tonique : 1, 2, 3…',earN:'Chante le chemin de la note jusqu\'à la tonique : combien de pas ?',earC:'Majeur ou mineur ? Tendu (V) ou reposant (I) ?',earP:'Écoute surtout la basse : monte-t-elle ou descend-elle ?'};
function mastery(m){const s=S.tr.stats[m];if(!s||!s.tot)return{pct:0,lab:'Nouveau',cls:'m0'};const p=Math.round(s.ok/s.tot*100);return s.tot>=20&&p>=85?{pct:p,lab:'Maîtrisé',cls:'m3'}:p>=60?{pct:p,lab:'En progrès',cls:'m2'}:{pct:p,lab:'À travailler',cls:'m1'};}
function pickWeighted(){const w=ALLM.map(([,m])=>{const s=S.tr.stats[m];if(!s||!s.tot)return 2;return 1+(1-s.ok/s.tot)*4+(s.tot<10?1:0);}),sum=w.reduce((a,b)=>a+b,0);let r=Math.random()*sum;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return ALLM[i];}return ALLM[0];}
function sessStart(){S.tr.sess={i:0,n:10,ok:0,hints:0,log:[],done:false};sessQ();}
function sessQ(){const[mod,m]=pickWeighted();S.tr.mod=mod;S.tr.mode=m;S.tr.hint=false;newQ();}
function sessHTML(){const ss=S.tr.sess;
  if(!ss)return`<div class="card"><h3>La séance du jour · 5 minutes</h3><p>10 questions mélangées, choisies pour toi : l'app propose plus souvent ce qui te pose problème, et revient régulièrement sur ce que tu sais déjà pour que ça reste. C'est la <b>répétition espacée</b>, la méthode la plus efficace pour mémoriser.</p>
   <ul class="clean"><li>Une question à la fois, une explication après chaque réponse.</li><li>Un indice si tu bloques (moins de points, mais tu apprends).</li><li>À la fin : ton score et ce qu'il faut revoir.</li></ul>
   <button class="btn" data-act="sessGo">▶ Commencer la séance</button></div>`;
  if(ss.done){const pct=Math.round(ss.ok/ss.n*100),weak=[...new Set(ss.log.filter(x=>!x.ok).map(x=>x.m))];
    return`<div class="card sessend"><div class="micbig">${ss.ok}/${ss.n}</div><p>${pct===100?(isKid()?'Parfait ! Tu es une star ⭐':'Séance parfaite.'):pct>=70?(isKid()?'Très bien joué ! 🎉':'Très bonne séance.'):(isKid()?'Bien essayé ! On continue demain 💪':'Bonne base : revois les points ci-dessous.')}</p>
     ${weak.length?`<p class="small">À revoir :</p><div class="chips">${weak.map(m=>{const x=ALLM.find(a=>a[1]===m);return`<button class="chip" data-trfree="${m}">${x?x[2]:m}</button>`;}).join('')}</div>`:''}
     <div class="row"><button class="btn" data-act="sessGo">Nouvelle séance</button><button class="btn alt" data-trview="skills">Voir mes compétences</button></div></div>`;}
  return`<div class="sessbar"><span>Question ${ss.i+1}/${ss.n}</span><div class="progress" style="flex:1;margin:0"><i style="width:${ss.i/ss.n*100}%"></i></div><span>✓ ${ss.ok}</span></div>
   <div class="small" style="margin:4px 0">${(ALLM.find(a=>a[1]===S.tr.mode)||['','',''])[2]}</div>${quizHTML()}`;}
function skillsHTML(){return`<div class="card"><p class="small" style="margin-top:0">Ta carte des compétences. « Maîtrisé » = au moins 85 % de réussite sur 20 questions. Touche une ligne pour t'entraîner dessus.</p>
  ${[['keys','Tonalités'],['deg','Degrés']].map(([g,n])=>`<h3 style="margin-top:12px">${n}</h3>${ALLM.filter(a=>a[0]===g).map(([,m,l])=>{const M=mastery(m),s=S.tr.stats[m];return`<button class="skill" data-trfree="${m}"><span>${l}</span><span class="sbar"><i class="${M.cls}" style="width:${M.pct}%"></i></span><small class="${M.cls}">${M.lab}${s&&s.tot?` · ${M.pct} % (${s.tot})`:''}</small></button>`;}).join('')}`).join('')}</div>`;}
function renderTrain(){const T=S.tr,v=T.view;if(!TRM[T.mod].some(m=>m[0]===T.mode))T.mode=TRM[T.mod][0][0];
  return `<section class="hero"><div class="pix">un peu chaque jour</div><h1>S'<span class="p">entraîner</span></h1>

  ${pedBar()}
  <div class="row" style="justify-content:center"><div class="seg"><button data-trview="sess" class="${v==='sess'?'on':''}">Séance du jour</button><button data-trview="free" class="${v==='free'?'on':''}">Libre</button><button data-trview="skills" class="${v==='skills'?'on':''}">Compétences</button><button data-trview="memo" class="${v==='memo'?'on':''}">Fiches</button></div></div>

/* ============ HELPERS STYLES & TIERS ============ */
function symLabel(s){return String(s).replace(/^([A-G][#b]?)/,m=>nm(parse(m))).replace(/\/([A-G][#b]?)$/,(x,m)=>'/'+nm(parse(m))).replace('dim','°').replace('b5','♭5').replace('b9','♭9');}
function symVoices(list,{lo=57,hi=79,ce=67,mode='solo',parallel=false}={}){const sv=S.sTr;S.sTr=0;const cs=list.map(parseChord),sets=cs.map(c=>arrSet(c,mode));S.sTr=sv;
  let v;if(parallel){const f=lead([sets[0]],lo,hi,ce)[0];v=cs.map(c=>f.map(m=>m+(c.root-cs[0].root)));}else v=lead(sets,lo,hi,ce);
  return cs.map((c,i)=>({c,rh:v[i],b:bass(c.bass,36)}));}
function tonesAbove(v,n){const pcs=v.c.ints.map(i=>mod(v.c.root+i)),out=[v.b];let m=v.b+3;while(out.length<n){if(pcs.includes(mod(m)))out.push(m);m++;}return out;}
const PAT={
 block:(v,B)=>[{lh:[v.b,v.b+12],rh:v.rh,d:B}],
 pop:(v,B)=>B<4?PAT.block(v,B):[{lh:[v.b,v.b+12],rh:v.rh,d:1.5,sus:B},{rh:v.rh,d:1.5},{rh:v.rh,d:B-3}],
 baroque:(v,B)=>{const t=tonesAbove(v,2),r=v.rh.slice(-3),seq=[['lh',t[0]],['lh',t[1]],['rh',r[0]],['rh',r[1]],['rh',r[2]],['rh',r[0]],['rh',r[1]],['rh',r[2]]];
   return[...Array(B*2).keys()].map(i=>{const[h,m]=seq[i%8];return{[h]:[m],d:.5,sus:h==='lh'?B-i*.5:.6};});},
 alberti:(v,B)=>{const[a,b,c]=v.rh.slice(0,3),p=[a,c,b,c];return[...Array(B*2).keys()].map(i=>i===0?{lh:[v.b],rh:[a],d:.5,sus:B}:{rh:[p[i%4]],d:.5,sus:.5});},
 nocturne:(v,B)=>{const t=tonesAbove(v,5),p=[t[0],t[2],t[3],t[4],t[3],t[2],t[1],t[2]],top=v.rh[v.rh.length-1];
   return[...Array(B*2).keys()].map(i=>i===0?{lh:[p[0]],rh:[top],d:.5,sus:B}:{lh:[p[i%8]],d:.5,sus:1.2});},
 stride:(v,B)=>{const f=v.b-5>=33?v.b-5:v.b+7;return[{lh:[v.b],d:1,sus:.9},{rh:v.rh,d:1,sus:.45},{lh:[f],d:1,sus:.9},{rh:v.rh,d:B-3,sus:.45}];},
 boogie:(v,B)=>{const iv=[0,4,7,9,10,9,7,4],b=v.b<40?v.b+12:v.b;return[...Array(B*2).keys()].map(i=>{const s={lh:[b+iv[i%8]],d:.5,sus:.45};if(i%4===3)s.rh=v.rh;return s;});},
 bossa:(v,B)=>[{lh:[v.b],rh:v.rh,d:1.5,sus:.7},{rh:v.rh,d:.5,sus:.4},{lh:[v.b+7],d:.5,sus:1.4},{rh:v.rh,d:B-2.5,sus:.6}],
 neosoul:(v,B)=>{const s7=v.c.ints.find(i=>[9,10,11].includes(i));return[{lh:[v.b,v.b+(s7??12)],d:.14,sus:B},{rh:v.rh,d:B-.14,sus:B-.3}];},
 ostinato:(v,B)=>{const r=v.rh,p=[r[0],r[1],r[2],r[1]];return[...Array(B*2).keys()].map(i=>i===0?{lh:[v.b,v.b+12],rh:[p[0]],d:.5,sus:B}:{rh:[p[i%4]],d:.5,sus:.8});},
 parallel:(v,B)=>[{lh:[v.b],rh:v.rh,d:B,sus:B+1}]};
function patSteps(list,pat,beats,opt={}){const vs=symVoices(list,opt);
  return vs.flatMap((v,i)=>{const B=Array.isArray(beats)?beats[i]:beats,st=PAT[pat](v,B),lh=[...new Set(st.flatMap(s=>s.lh||[]))],rh=[...new Set(st.flatMap(s=>s.rh||[]))];
    return st.map((s,j)=>({...s,show:{lh,rh},...(j===0?{label:symLabel(list[i])}:{})}));});}

   <li><b>Pour composer dans un style</b> : une tonalité S, un enchaînement S, un arpège S. Puis remplace un des trois par un A pour te démarquer.</li>

const GLOSS=[['Accord','Plusieurs notes jouées ensemble (souvent 3). Ex. : Do-Mi-Sol.'],['Altération','Signe qui monte (♯) ou baisse (♭) une note d\'un demi-ton.'],['Armure','Les ♯ ou ♭ écrits au début de la partition : ils valent pour tout le morceau.'],['Arpège','Les notes d\'un accord jouées l\'une après l\'autre au lieu d\'ensemble.'],['Basse','La note la plus grave, en général jouée par la main gauche.'],['Bémol (♭)','Baisse une note d\'un demi-ton : la touche juste à gauche.'],['Cadence','Enchaînement d\'accords qui termine une phrase, comme une ponctuation.'],['Degré','Le numéro d\'une note dans la gamme : 1re, 2e, 3e…'],['Demi-ton','La plus petite distance au piano : d\'une touche à sa voisine immédiate.'],['Dièse (♯)','Monte une note d\'un demi-ton : la touche juste à droite.'],['Doigté','Quel doigt joue quelle note (numéros de 1 à 5).'],['Gamme','Suite de notes rangées dans l\'ordre, d\'une note à la même plus haut.'],['Grave / aigu','Grave = sons bas, à gauche. Aigu = sons hauts, à droite.'],['Intervalle','La distance entre deux notes.'],['Legato','Jouer lié : on lève un doigt au moment où le suivant joue.'],['MD / MG','Main droite / main gauche.'],['Majeur','Couleur lumineuse, « joyeuse ».'],['Mesure','Petit groupe de temps (souvent 4) qui se répète.'],['Métronome','Appareil qui fait « tic » à vitesse régulière pour garder le tempo.'],['Mineur','Couleur plus sombre, « triste » ou mystérieuse.'],['Mode','Une gamme qui commence sur une autre note de départ : autre couleur.'],['Octave','La même note, plus haut ou plus bas : 8 touches blanches plus loin.'],['Pédale','La pédale de droite fait résonner les notes après qu\'on a levé les doigts.'],['Progression (grille)','Une suite d\'accords qui forme la base d\'un morceau.'],['Pulsation (temps)','Le battement régulier sur lequel on tape du pied.'],['Quinte','Intervalle de 5 notes (Do → Sol).'],['Relative','Tonalité majeure et mineure qui ont les mêmes notes (Do majeur et La mineur).'],['Renversement','Même accord, mais avec une autre note en bas.'],['Sensible','La 7e note de la gamme, qui « tire » vers la tonique.'],['Staccato','Jouer piqué, détaché, notes courtes.'],['Tempo (bpm)','La vitesse. bpm = battements par minute.'],['Tierce','Intervalle de 3 notes (Do → Mi). Elle décide si un accord est majeur ou mineur.'],['Ton','Deux demi-tons.'],['Tonalité','La « famille » de notes d\'un morceau, organisée autour d\'une note maison.'],['Tonique','La note « maison » d\'une tonalité, la 1re de la gamme.'],['Touche','Chaque levier du clavier, blanc ou noir.'],['Transposer','Jouer le même morceau plus haut ou plus bas.'],['Voicing','La façon de placer les notes d\'un accord sur le clavier.']];
function begNewTarget(){const wp=[0,2,4,5,7,9,11].filter(p=>p!==S.bg.t);S.bg.t=pick(wp);}

  if(!g.g)[0,2,4,5,7,9,11].forEach((p,i)=>{mk[60+p]={c:'y',f:S.nota==='fr'?['Do','Ré','Mi','Fa','So','La','Si'][i]:LET[i]};});

function renderStart(){const sec=(n,t,body)=>`<section class="step"><div class="stepn">${n}</div><div class="stepb"><h2>${t}</h2>${body}</div></section>`;
  const g=S.bg,K=spell('C',MAJ);
  const melody=[[60,1],[60,1],[60,1],[62,2],[64,3,2],[62,2,2],[60,1],[64,3],[62,2],[62,2],[60,1,4]];
  return `<section class="hero"><div class="pix">zéro → premier morceau</div><h1>Le piano en<br><span class="p">partant de zéro</span></h1>
  <p class="lead">Aucun vocabulaire nécessaire. Chaque mot nouveau est expliqué au moment où il arrive, et il y a un lexique en bas de page. Prends les étapes dans l'ordre, une ou deux par jour.</p></section>

  ${sec(1,'Le clavier',`<p>Un piano, ce sont des <b>touches</b> blanches et noires. À <b>gauche</b>, les sons sont <b>graves</b> (bas, comme une grosse voix). À <b>droite</b>, ils sont <b>aigus</b> (hauts, comme un oiseau).</p>
   <p class="small">Essaie : touche une touche à gauche, puis une à droite sur le clavier ci-dessous.</p>
   <div class="kbwrap" id="begkb">${begKb()}</div>
   <p>Les touches noires sont rangées par groupes de <b>2</b> et de <b>3</b>. C'est ta boussole : grâce à elles, tu sauras toujours où tu es.</p>`)}

  ${sec(2,'Le nom des notes',`<p>Il n'y a que <b>7 noms de notes</b> : <b>Do Ré Mi Fa Sol La Si</b>. En anglais, on dit <b>C D E F G A B</b>. Ensuite, ça recommence.</p>
   <div class="tip"><b>Le repère à retenir</b>Le <b>Do</b> est toujours la touche blanche juste à <b>gauche du groupe de 2 noires</b>.</div>
   <div class="row"><button class="btn ${g.g==='do'?'':'alt'}" data-bgame="do">🎯 Jeu : trouve tous les Do</button><button class="btn ${g.g==='note'?'':'alt'}" data-bgame="note">🎯 Jeu : trouve la note</button>${g.g?`<button class="btn alt" data-bgame="">Afficher les noms</button>`:''}</div>
   ${g.g==='do'?`<p class="qtext">Touche tous les <b>Do</b> du clavier de l'étape 1 (${g.found.length}/3).</p>`:''}
   ${g.g==='note'?`<p class="qtext">Touche un <b>${nm(K[[0,2,4,5,7,9,11].indexOf(g.t)])}</b> sur le clavier de l'étape 1. <span class="small">(${g.ok} trouvés)</span></p>`:''}
   ${g.msg?`<div class="fb ${g.msg.startsWith('✓')?'ok':'ko'}">${g.msg}</div>`:''}`)}

  ${sec(3,'L\'octave',`<p>Joue un Do, puis le Do suivant vers la droite : c'est <b>la même note, en plus aigu</b>. Cette distance s'appelle une <b>octave</b> (8 touches blanches).</p>
   <div class="row"><button class="btn alt" data-bplay="48">▶ Do grave</button><button class="btn alt" data-bplay="60">▶ Do du milieu</button><button class="btn alt" data-bplay="72">▶ Do aigu</button></div>
   <p class="small">Le Do au milieu du piano s'appelle le <b>Do central</b>. On s'en sert comme point de départ.</p>`)}

  ${sec(4,'Dièse, bémol, demi-ton',`<p>Le <b>demi-ton</b> est le plus petit pas : on passe d'une touche à sa <b>voisine immédiate</b>, blanche ou noire. Deux demi-tons font un <b>ton</b>.</p>
   <p>Une touche noire porte deux noms. Celle entre Do et Ré est un <b>Do♯</b> (dièse = un demi-ton plus haut que Do) ou un <b>Ré♭</b> (bémol = un demi-ton plus bas que Ré).</p>
   <div class="kbwrap">${kb({61:{c:'rh',f:'♯♭'},64:{c:'lh',f:''},65:{c:'lh',f:''},71:{c:'y',f:''},72:{c:'y',f:''}},60,83)}</div>
   <p class="small">En bleu et en jaune : Mi–Fa et Si–Do. Il n'y a pas de touche noire entre elles, ce sont déjà des demi-tons.</p>`)}

  ${sec(5,'Tes doigts ont des numéros',`<div class="hands">${handSVG('lh')}${handSVG('rh')}</div>
   <p>Pouce = 1, auriculaire = 5, sur les deux mains. Dans toute l'app, le chiffre dans un rond sur une touche indique le doigt à utiliser : c'est le <b>doigté</b>.</p>
   <div class="tip p"><b>Bien s'asseoir</b>Au bord du banc, coudes à hauteur du clavier, main arrondie comme si tu tenais une balle, épaules basses. On joue avec le bout des doigts, sans forcer.</div>`)}

  ${sec(6,'Le rythme',`<p>La musique avance sur un battement régulier, la <b>pulsation</b> : c'est ce que tu tapes du pied. Chaque battement est un <b>temps</b>. On les compte par groupes de 4, appelés <b>mesures</b>.</p>
   <table class="t"><tr><td><b>Ronde</b></td><td>4 temps</td></tr><tr><td><b>Blanche</b></td><td>2 temps</td></tr><tr><td><b>Noire</b></td><td>1 temps</td></tr><tr><td><b>Croche</b></td><td>½ temps</td></tr></table>
   ${exCard({title:'Écoute : ronde, blanches, noires, croches',bpm:80,display:0,steps:[{rh:[60],rhF:[1],d:4,label:'Ronde'},{rh:[60],rhF:[1],d:2,label:'Blanches'},{rh:[60],rhF:[1],d:2},{rh:[60],rhF:[1],d:1,label:'Noires'},{rh:[60],rhF:[1],d:1},{rh:[60],rhF:[1],d:1},{rh:[60],rhF:[1],d:1},...Array(8).fill(0).map((x,i)=>({rh:[60],rhF:[1],d:.5,...(i?{}:{label:'Croches'})}))]})}
   <p class="small">Le <b>tempo</b> est la vitesse, en bpm (battements par minute). 60 bpm = un temps par seconde.</p>`)}

  ${sec(7,'Ta première mélodie',`<p>Place ton pouce droit (1) sur le Do central, et un doigt par touche : 2 sur Ré, 3 sur Mi. Tu n'as plus qu'à suivre les numéros.</p>
   ${exCard({title:'Au clair de la lune (traditionnel)',bpm:92,display:'all',steps:melody.map(([m,f,d])=>({rh:[m],rhF:[f],d:d||1}))})}
   <p class="small">Joue-la lentement 5 fois. Puis sans regarder tes mains.</p>`)}

  ${sec(8,'La gamme',`<p>Une <b>gamme</b>, c'est 8 notes rangées dans l'ordre, d'un Do au Do suivant. La plus simple : <b>Do majeur</b>, toutes les touches blanches.</p>
   <p>Le secret de toutes les gammes majeures : la même recette de pas, <b>ton – ton – demi-ton – ton – ton – ton – demi-ton</b>.</p>
   ${exCard({title:'La gamme de Do majeur',bpm:84,display:'all',tip:'Au 4e son, le pouce passe sous la main pour continuer : c\'est le passage du pouce.',steps:[60,62,64,65,67,69,71,72].map((m,i)=>({rh:[m],rhF:[[1,2,3,1,2,3,4,5][i]],d:1}))})}`)}

  ${sec(9,'L\'accord',`<p>Un <b>accord</b>, ce sont plusieurs notes jouées ensemble. La recette de base : prends une note, saute-en une, prends la suivante, saute-en une, prends la suivante. Do – (Ré) – Mi – (Fa) – Sol = <b>Do majeur</b>.</p>
   <p>Baisse le Mi d'un demi-ton (Mi♭) : tu obtiens <b>Do mineur</b>. Écoute la différence de couleur : <b>majeur</b> = lumineux, <b>mineur</b> = sombre.</p>
   ${exCard({title:'Majeur ou mineur ?',bpm:70,steps:[{rh:[60,64,67],d:3,label:'Do majeur'},{rh:[60,63,67],d:3,label:'Do mineur'}]})}`)}

  ${sec(10,'La tonalité',`<p>Une <b>tonalité</b>, c'est la famille de notes d'un morceau, organisée autour d'une note <b>maison</b>, la <b>tonique</b>. Un morceau « en Do majeur » utilise surtout les notes de la gamme de Do, et se termine en général sur Do.</p>
   ${exCard({title:'Écoute : une phrase qui finit à la maison, puis une qui reste en suspens',bpm:96,steps:[{lh:[48],rh:[64],d:1,label:'Finit sur Do'},{rh:[62],d:1},{rh:[64],d:1},{rh:[67],d:1},{lh:[43],rh:[65],d:1},{rh:[64],d:1},{rh:[62],d:1},{lh:[48],rh:[60],d:3},{d:1},{lh:[48],rh:[64],d:1,label:'Finit sur Ré'},{rh:[62],d:1},{rh:[64],d:1},{rh:[67],d:1},{lh:[43],rh:[65],d:1},{rh:[64],d:1},{rh:[60],d:1},{lh:[43],rh:[62],d:3}]})}
   <p class="small">Tu sens que la première est finie et que la seconde attend une suite ? Ton oreille connaît déjà la tonalité.</p>`)}

  ${sec(11,'Les degrés',`<p>On numérote les notes de la gamme : Do = 1, Ré = 2, Mi = 3… Ce numéro s'appelle le <b>degré</b>. On fait pareil avec les accords construits sur chaque note, en chiffres romains : <b>I, ii, iii, IV, V, vi, vii°</b>.</p>
   <p>Pourquoi c'est génial : une chanson « I – V – vi – IV » se joue dans n'importe quelle tonalité. Tu apprends une fois, tu joues partout. Les 3 accords les plus importants : <b>I</b> (la maison), <b>IV</b> (on part), <b>V</b> (on veut revenir).</p>
   <div class="vform"><b>La formule magique</b>Sur les 7 degrés : <b>Majeur, mineur, mineur, Majeur, Majeur, mineur, diminué</b>. Les grands (majuscules I, IV, V) sont majeurs, les petits (ii, iii, vi) sont mineurs. <button class="chip" data-tab="deg">En savoir plus →</button></div>
   ${exCard({title:'I – IV – V – I en Do',bpm:80,steps:[{lh:[48],rh:[60,64,67],d:2,label:'I · Do'},{lh:[41],rh:[60,65,69],d:2,label:'IV · Fa'},{lh:[43],rh:[59,62,67],d:2,label:'V · Sol'},{lh:[48],rh:[60,64,67],d:3,label:'I · Do'}]})}`)}

function apChord(){const q=APQ.find(x=>x[0]===S.ap.q),r=S.ap.root,pcs=q[3].map(i=>mod(r+i));let rh=q[3].map(i=>60+r+i);while(rh[rh.length-1]>79)rh=rh.map(x=>x-12);

function kpcN(pc){const sc=spell(MAJ_KEYS[S.gk].t,MAJ),n=sc.find(x=>x.pc===mod(pc));return n?nm(n):nm(parse((gFlat()||[1,3,8,10].includes(mod(pc))?FLAT:SHARP)[mod(pc)]));}
function role(m,root,q){const iv=mod(m-root);const map={0:'1',1:'♭9',2:q[3].includes(14)?'9':'2',3:'♭3',4:'3',5:'4',6:'♭5',7:'5',8:'♯5',9:'6',10:'♭7',11:'7'};return map[iv];}

  let b5=b+5;while(!C.pcs.includes(mod(b5))&&b5<b+9)b5++;if(!C.pcs.includes(mod(b5)))b5=b+7;
  return{B:['lh',b],B5:['lh',b5],B8:['lh',b+12],'1':['rh',R[0]],'3':['rh',third],'5':['rh',fifth],'1u':['rh',R[0]+12],'3u':['rh',third+12],'5u':['rh',fifth+12],'-':[null,null]}[tok];}
function apOrderMarks(seq){const mk={},ord={};seq.forEach((it,i)=>{[...(it.lh||[]).map(m=>['lh',m]),...(it.rh||[]).map(m=>['rh',m])].forEach(([h,m])=>{(ord[m]=ord[m]||{h,o:[]}).o.push(i+1);});});

function renderArps(){const C=apChord(),P=S.ap.pat,info=APINFO[P],seq=P==='plaque'?[{lh:C.lh,rh:C.rh,d:4}]:arpSeq(P,C.lh,C.rh),root=60+S.ap.root;

function ahScale(d){const pc=gpc();if(!S.ah.min)return spell(MAJ_KEYS[S.gk].t,MAJ);const mi=MIN_KEYS.findIndex(k=>parse(k.t).pc===pc),sc=spell(MIN_KEYS[mi].t,MIN);

function ahChord(d,sys){const sc=ahScale(d),root=sc[d],note=st=>sc[(d+st-1)%7],ivOf=st=>mod(note(st).pc-root.pc)+(st>=9?12:0);
  const S_=AHS[sys],b=bass(root.pc,36),lh=[b];S_.lh.slice(1).forEach(st=>{let m=lh[lh.length-1]+1;while(mod(m)!==note(st).pc)m++;lh.push(m);});

  const used=[...S_.lh,...S_.rh],e9=used.includes(9)?ivOf(9):null,e11=used.includes(11)?ivOf(11):null,e13=used.includes(13)?ivOf(13):null,mi=base.startsWith('m')&&base!=='maj7';
  let q;
  if(sys==='69')q=(mi?'m':'')+'6/9';else if(sys==='sus')q='9sus4';else if(sys==='7')q=base;else if(sys==='ø11')q='m11b5';
  else if(e13!==null){if(base==='7')q=(e9===13||e13===20)?'7'+(e9===13?'b9':'')+(e13===20?'b13':''):'13';else q=(base==='maj7'?'maj13':'m13')+(e11===18?'#11':'');}

S.dg={min:false,sev:false,sel:0,q:null,qn:0,qok:0};
function dgScale(){const pc=gpc();if(!S.dg.min)return{sc:spell(MAJ_KEYS[S.gk].t,MAJ),type:'maj'};const mi=MIN_KEYS.findIndex(k=>parse(k.t).pc===pc);return{sc:spell(MIN_KEYS[mi].t,MIN),type:'min'};}
const QUAL=q=>q.startsWith('m7b5')||q==='m7♭5'?['demi-diminué','dim']:q.startsWith('°')?['diminué','dim']:(q.startsWith('m')&&!q.startsWith('maj'))?['mineur','min']:q==='+'?['augmenté','aug']:['Majeur','maj'];
function dgChords(sev){const{sc,type}=dgScale();return[0,1,2,3,4,5,6].map(d=>chordAt(sc,d,sev??S.dg.sev,false));}
function dgNewQ(){const{sc}=dgScale(),ch=dgChords(false),d=Math.floor(Math.random()*7),t=Math.floor(Math.random()*4),kn=nm(sc[0])+(S.dg.min?' mineur':' majeur');let q;
  if(t===0)q={text:`En ${kn}, l'accord du degré <b>${d+1}</b> est…`,opts:['Majeur','mineur','diminué'],ans:['Majeur','mineur','diminué'].indexOf(QUAL(ch[d].q)[0]),exp:`Degré ${d+1} = <b>${ch[d].name}</b> (${ch[d].rom}). Formule : ${S.dg.min?'m · dim · M · m · m · M · M':'M · m · m · M · M · m · dim'}.`};
  else if(t===1){const names=ch.map(c=>c.name),o=shuffle([d,...shuffle([0,1,2,3,4,5,6].filter(x=>x!==d)).slice(0,2)]);q={text:`En ${kn}, quel est l'accord <b>${ch[d].rom}</b> ?`,opts:o.map(x=>names[x]),ans:o.indexOf(d),exp:`${ch[d].rom} = degré ${d+1}, sur la note ${nm(sc[d])} : <b>${ch[d].name}</b>.`};}
  else if(t===2){const o=shuffle([d,...shuffle([0,1,2,3,4,5,6].filter(x=>x!==d)).slice(0,2)]);q={text:`En ${kn}, <b>${ch[d].name}</b> est le degré…`,opts:o.map(x=>ch[x].rom),ans:o.indexOf(d),exp:`On compte depuis la tonique ${nm(sc[0])} : ${nm(sc[d])} est la ${d+1}e note.`};}
  else{const R=[['IV','Majeur'],['vi','mineur'],['vii°','diminué'],['V','Majeur'],['ii','mineur']][Math.floor(Math.random()*5)];q={text:`Que veut dire le chiffre romain <b>${R[0]}</b> ?`,opts:['Majeur','mineur','diminué'],ans:['Majeur','mineur','diminué'].indexOf(R[1]),exp:'MAJUSCULE = majeur · minuscule = mineur · ° = diminué.'};}
  S.dg.q={...q,pick:null};}
function renderDeg(){const D=S.dg,{sc,type}=dgScale(),ch=dgChords(),ch3=dgChords(false),c=ch[D.sel],kn=nm(sc[0])+(D.min?' mineur':' majeur');
  const base=60+sc[0].pc-(sc[0].pc>6?12:0),scM=stack(sc.map(n=>n.pc),base);scM.push(scM[0]+12);const nmk={};scM.forEach((m,i)=>nmk[m]={c:i%7===0?'lh':'y',f:String(i%7+1)});

  const v=[base+mod(c.pcs[0]-sc[0].pc)];c.pcs.slice(1).forEach(p=>{let m=v[v.length-1]+1;while(mod(m)!==p)m++;v.push(m);});
  const semis=v.slice(1).map((m,i)=>m-v[i]),mk={};v.forEach((m,i)=>mk[m]={c:i===0?'lh':'rh',f:['1','3','5','7'][i]});
  const formula=D.min?['m','dim','M','m','m','M','M']:['M','m','m','M','M','m','dim'],f7=D.min?['m7','ø','maj7','m7','m7','maj7','7']:['maj7','m7','m7','maj7','7','m7','ø'];
  const Q=D.q,qok=Q&&Q.pick===Q.ans;
  const climb=exCard({keyAware:1,tag:'Écoute',title:`Les 7 accords de ${kn}, en montant`,bpm:76,steps:ch3.map(x=>{const r0=base+mod(x.pcs[0]-sc[0].pc),vv=[r0];x.pcs.slice(1).forEach(p=>{let m=vv[vv.length-1]+1;while(mod(m)!==p)m++;vv.push(m);});return{lh:[r0-12],rh:vv,d:1.5,label:x.rom+' · '+x.name};}).concat([{lh:[base],rh:[base+12,base+(D.min?15:16),base+19],d:3,label:(D.min?'i':'I')+' (octave)'}])});
  return `<section class="hero"><div class="pix">1, 2, 3… et tout devient clair</div><h1>Les<br><span class="p">degrés</span></h1>
  <p class="lead">${isKid()?'Chaque note de la gamme a un numéro, comme les joueurs d\'une équipe. Sur chaque numéro, on peut construire un accord : certains sont joyeux (majeurs), d\'autres plus tristes (mineurs). Et la bonne nouvelle : c\'est toujours la même formule !':'Un degré est la position d\'une note dans la gamme. Sur chaque degré, on construit un accord avec les seules notes de la gamme : sa qualité (majeur, mineur, diminué) en découle, et suit la même formule dans toutes les tonalités.'}</p></section>
  ${pedBar()}
  <div class="row" style="justify-content:center"><div class="seg"><button data-dgmin="0" class="${!D.min?'on':''}">Majeur</button><button data-dgmin="1" class="${D.min?'on':''}">Mineur</button></div></div>

  <h2>1 · Numéroter la gamme</h2>
  <p>Voici la gamme de <b>${kn}</b>. On donne un numéro à chaque note : c'est son <b>degré</b>. La 1re s'appelle la <b>tonique</b> (la maison).</p>
  <div class="card"><div class="kbwrap">${kb(nmk)}</div><p class="notes">${sc.map((n,i)=>`<span class="dgn">${i+1}</span>${nm(n)}`).join(' ')}</p></div>

  <h2>2 · Un accord sur chaque degré</h2>
  <p>Sur chaque note, on empile <b>une note sur deux</b> de la gamme (1 – 3 – 5). On obtient 7 accords. Touche-les pour les entendre.</p>
  <div class="row"><div class="seg"><button data-dgsev="0" class="${!D.sev?'on':''}">Accords de 3 notes</button><button data-dgsev="1" class="${D.sev?'on':''}">Avec la 7e</button></div></div>
  <div class="dgrid">${ch.map((x,d)=>{const Qq=QUAL(x.q);return`<button class="dgc q-${Qq[1]} ${D.sel===d?'sel':''}" data-dgsel="${d}"><span class="dgnum">${d+1}</span><b>${x.rom}</b><span class="dgname">${x.name}</span><span class="qb">${Qq[0]}</span></button>`;}).join('')}</div>
  <div class="vform"><b>La formule à retenir${D.min?' (mineur)':''}</b><span class="fml">${(D.sev?f7:formula).map((x,i)=>`<span class="q-${x==='M'||x==='maj7'||x==='7'?'maj':x==='dim'||x==='ø'?'dim':'min'}">${i+1}<small>${x}</small></span>`).join('')}</span>
   ${D.min?'En mineur, c\'est la même formule que le majeur, mais qui commence au 6e degré.':'Majeurs : 1, 4, 5 · mineurs : 2, 3, 6 · diminué : 7. Elle est identique dans les 12 tonalités majeures.'}${D.sev?' Avec la 7e : un seul accord « 7 » (dominante), sur le '+(D.min?'VII':'V')+'.':''}</div>

  <h2>3 · Pourquoi majeur ou mineur ?</h2>

   <div class="kbwrap">${kb(mk)}</div>

   <table class="t" style="margin-top:8px"><tr><td><span class="qb inl q-maj">Majeur</span></td><td><b>4</b> puis <b>3</b> demi-tons · lumineux</td></tr><tr><td><span class="qb inl q-min">mineur</span></td><td><b>3</b> puis <b>4</b> demi-tons · plus sombre</td></tr><tr><td><span class="qb inl q-dim">diminué</span></td><td><b>3</b> puis <b>3</b> demi-tons · tendu</td></tr></table></div>
  ${climb}

  ${testMe(v.map(m=>m).concat([v[0]-12]),enOf(c.pcs[0],c.q),isKid()?'Construis le '+c.rom+' dans le simulateur, puis joue-le sur ton piano pour le micro !':'Construis cet accord dans le simulateur, puis joue-le sur ton piano et vérifie-le au micro.')}

   <p class="small">Avantage : « I – V – vi – IV » se lit pareil dans toutes les tonalités. En ${kn} : ${[0,4,5,3].map(d=>ch3[d].name).join(' – ')}.</p></div>

   <tr><td class="small">Mineur</td>${['m','°','M','m','m','M','M'].map(x=>`<td class="q-${x==='M'?'maj':x==='°'?'dim':'min'}t">${x}</td>`).join('')}</tr></table>
   <p class="small">Astuce : la gamme mineure relative utilise les <b>mêmes accords</b> que la majeure. Le vi de ${nm(spell(MAJ_KEYS[S.gk].t,MAJ)[0])} majeur devient le i de sa relative mineure. En mineur, on remplace souvent le v mineur par un <b>V majeur</b> pour mieux revenir à la tonique.</p></div>

 'Le « crush »':['On écrase la tierce mineure contre la tierce majeure : la note noire glisse vers la blanche.','Cette « note bleue » donne le son blues et gospel, entre joie et douleur.','Ray Charles, Aretha Franklin, le gospel et le blues.','Sur un accord majeur, glisse ♭3 → 3 très vite avec un seul doigt.','Joue les deux notes ensemble pour un effet « barrelhouse ».'],
 'Lick de base':['Quatre notes de la gamme blues : ♭3 – 3 – 5 – ♭7.','On y entend la note bleue (♭3 → 3) et la 7e mineure : toute l\'âme du blues.','Ray Charles, les pianistes de Chicago, le rock\'n\'roll.','Joue-le sur chaque accord de la grille de 12 mesures, sans le changer.','Termine sur la tonique une octave plus haut.'],
 'Trémolo de tierce':['Deux notes d\'un accord alternées très vite.','L\'énergie monte : on imite les cuivres et les guitares saturées.','Le rock\'n\'roll de Jerry Lee Lewis, le boogie-woogie.','Place-le à la fin d\'un chorus pour faire monter la tension.','Trémolo d\'octave : la même note, une octave d\'écart.'],
 'Phrase en 9e':['Une mélodie qui se pose sur la 9e de l\'accord au lieu de la tonique.','La 9e donne la douceur « saudade » : rien n\'est tout à fait résolu.','Les mélodies de Jobim (« Garota de Ipanema », « Wave »).','Termine chaque phrase sur la 9e ou la 13e de l\'accord.','Rejoue-la une tierce plus haut sur l\'accord suivant.'],
 'Descente chromatique':['Quatre demi-tons qui glissent vers la tierce.','Le chromatisme doux suit les accords qui, en bossa, descendent eux aussi par demi-tons.','Les ponts et les transitions de bossa nova.','À la fin d\'une phrase, glisse vers une note de l\'accord suivant.','Monte au lieu de descendre.'],
 'Motif héroïque':['Un grand saut de quinte vers le haut, puis une descente par degrés.','La quinte ascendante sonne ouverte et noble : un appel de héros.','Les thèmes d\'aventure et de super-héros au cinéma.','Joue-le en octaves aux deux mains pour un effet d\'orchestre.','Remplace la quinte par une octave pour plus de grandeur.'],
 'Suspension':['La 9e tenue sur l\'accord, qui se résout ensuite sur la tierce.','On retarde la note attendue : l\'oreille patiente, puis se détend.','Les musiques de film émouvantes, les ballades néo-classiques.','Tiens la 9e plus longtemps que tu ne le crois, puis résous doucement.','Suspension 4 → 3 : la quarte qui descend sur la tierce.']};
function lickExtra(L){const X=LICKX[L.n],o=gOffG(),tp=gpc(),R={0:'1',1:'♭2',2:'2',3:'♭3',4:'3',5:'4',6:'♯4',7:'5',8:'♭6',9:'6',10:'♭7',11:'7'};
  const notes=L.n2.map(([m])=>`${kpcN(m+o)}<sup>${R[mod(m+o-tp)]}</sup>`).join(' ');
  return`<div class="lickx">${X?`<p><b>C'est quoi ?</b> ${X[0]}</p><p><b>Pourquoi ça sonne :</b> ${X[1]}</p><p><b>🎵 Où on l'entend :</b> ${X[2]}</p><p><b>Comment l'utiliser :</b> ${X[3]}</p><p><b>Variante :</b> ${X[4]}</p>`:''}
   <p class="small"><b>Les notes</b> (degré au-dessus) : ${notes}</p><p class="small">Méthode : écoute 2 fois → chante-le → joue-le lentement → place-le sur la grille → change une note ou le rythme.</p></div>`;}

  ahPlay(b){const c=ahChord(S.ah.deg,ahSys(S.ah.deg));play(applyArp([{lh:c.lh,rh:c.rh,lhF:c.lhF,rhF:c.rhF,d:3,label:c.label},{rh:[...c.rh].reverse().map(x=>x),d:.01,sus:.01}].slice(0,1),S.arp),{bpm:76,btn:b});},

  mCompare(b){if(b.classList.contains('playing')){stopAll();return;}const{sc}=modeData(),maj=spell(sc[0].l+(sc[0].a>0?'#'.repeat(sc[0].a):'b'.repeat(-sc[0].a)),MAJ),bs=60+sc[0].pc-(sc[0].pc>6?12:0);

  fgGo(){const v=document.getElementById('fgin');S.fg.text=v?v.value:'';stopAll();keep(()=>{});},
  artScale(b){const A=artGet(S.art)||ARTISTS.chopin,sc=A.scale||[0,MAJ],r=mod(sc[0]+(A.progs[0]?artOff(A.progs[0].syms):0)),m=sc[1].map(i=>60+r+i).concat([72+r]);play([...m,...m.slice(0,-1).reverse()].map(x=>({rh:[x],d:.5})),{bpm:110,btn:b});},

  apPlay(b){if(!b)return;if(b.classList.contains('playing')){stopAll();return;}const C=apChord(),P=S.ap.pat,one=[{lh:C.lh,rh:C.rh,d:4}],st=applyArp([...one,...one],P==='plaque'?'plaque':P);

      onEnd:()=>{const el=document.getElementById('apkb');if(el)el.innerHTML=kb(apOrderMarks(P==='plaque'?one:arpSeq(P,C.lh,C.rh)),36,95);}});},
  apCustom(b){if(b.classList.contains('playing')){stopAll();return;}const C=apChord(),one=S.ap.custom.map(k=>{const[h,m]=apTokNote(k,C);return h?{[h]:[m],d:.5,sus:h==='lh'?2:1}:{d:.5};});

  stScale(b){const[r0,ints]=STYLES[S.st].scale,r=mod(r0+gOffG()),m=ints.map(i=>60+r+i).concat([72+r]);play([...m,...m.slice(0,-1).reverse()].map(x=>({rh:[x],d:.5})),{bpm:110,btn:b});},
  trNext(){stopAll();const T=S.tr;if(T.view==='sess'&&T.sess&&!T.sess.done){T.sess.i++;if(T.sess.i>=T.sess.n){T.sess.done=true;if(T.sess.ok===T.sess.n){S.ped.perfect=(S.ped.perfect||0)+1;addXP(30,'séance parfaite');}else addXP(15,'séance terminée');savePed();keep(()=>{});return;}sessQ();keep(()=>{});return;}T.hint=false;newQ();keep(()=>{});},
  dgPlay(b){const{sc}=dgScale(),c=dgChords()[S.dg.sel],base=60+sc[0].pc-(sc[0].pc>6?12:0),v=[base+mod(c.pcs[0]-sc[0].pc)];c.pcs.slice(1).forEach(p=>{let m=v[v.length-1]+1;while(mod(m)!==p)m++;v.push(m);});PB.noCoach=1;play([...v.map(m=>({rh:[m],d:.5,sus:2})),{lh:[v[0]-12],rh:v,d:2.5}],{bpm:96,btn:b});},
  dgQ(){if(S.dg.qn>=5){S.dg.qn=0;S.dg.qok=0;}dgNewQ();keep(()=>{});},

  vmRetry(){S.vm.pick=null;S.vm.earAns=null;keep(()=>{});},

  trReplay(){play(S.tr.q.audio,{bpm:100});},
  trAfter(){play(S.tr.q.after[1],{bpm:90});},
  trClear(){S.tr.sel=[];keep(()=>{});},
  trCheck(){const T=S.tr,a=new Set(T.sel.map(mod)),b=new Set(T.q.target);const ok=a.size===b.size&&[...a].every(x=>b.has(x));T.ans=ok?1:0;answer(ok);keep(()=>{});

  trUp(){S.sTr=S.sTr>=6?-5:S.sTr+1;stopAll();savePrefs();keep(()=>{});},
  restorePreset(){S.hidePreset=false;savePrefs();keep(()=>{});},
  trDown(){S.sTr=S.sTr<=-5?6:S.sTr-1;stopAll();savePrefs();keep(()=>{});},
  songPlay(b){if(b.classList.contains('playing')){stopAll();return;}const song=S.song,arr=arrange(song),fl=prefFlat(song);
    play(songSteps(song,arr),{bpm:S.sBpm,btn:b,onStep:st=>{if(!st.show)return;const el=document.getElementById('songkb');if(!el)return;el.innerHTML=kb(stepMarks(st),36,83);
      document.querySelectorAll('[data-bar]').forEach(t=>t.classList.toggle('cur',t.dataset.bar===st.tag));
      const[si,bi]=st.tag.split('-').map(Number);const h=document.getElementById('curch');if(h)h.textContent=splitBar(song.sections[si].bars[bi]).map(s=>trSym(s,song)).join(' · ');

      onEnd:()=>document.querySelectorAll('.bar.cur').forEach(t=>t.classList.remove('cur'))});},

      if(s.label){const j=Math.min(+s.label.slice(1),st.length-1);document.querySelectorAll('[data-vlstep]').forEach(c=>c.classList.toggle('on',+c.dataset.vlstep===j));}}});}
};
